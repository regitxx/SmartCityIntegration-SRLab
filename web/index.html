<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LAB_SRL · SMART_CITY_INTEGRATION · v0</title>
<link rel="stylesheet" href="/assets/style.css" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230B0B0A'/><text x='8' y='22' font-family='monospace' font-size='20' fill='%23C9A24A'>&#8805;</text></svg>" />
</head>
<body data-theme="dark">
<header class="chrome" role="banner">
  <div class="label" aria-hidden="true">LAB_SRL · SMART_CITY_INTEGRATION · v0</div>
  <div class="header-spacer"></div>
  <label class="lang-selector" aria-label="chat language">
    <span class="lang-prefix">lang:</span>
    <select id="lang" aria-label="select input and output language">
      <option value="auto" lang="en" selected>auto</option>
      <option value="yue" lang="yue">廣東話</option>
      <option value="zh-Hant" lang="zh-Hant">繁體中文</option>
      <option value="zh-Hans" lang="zh-Hans">简体中文</option>
      <option value="en" lang="en">English</option>
      <option value="ja" lang="ja">日本語</option>
      <option value="ko" lang="ko">한국어</option>
      <option value="fr" lang="fr">Français</option>
      <option value="de" lang="de">Deutsch</option>
      <option value="es" lang="es">Español</option>
      <option value="th" lang="th">ไทย</option>
      <option value="tl" lang="tl">Tagalog</option>
      <option value="id" lang="id">Bahasa Indonesia</option>
      <option value="vi" lang="vi">Tiếng Việt</option>
    </select>
  </label>
  <div class="session" aria-label="session id">session: <span id="session-id">—</span></div>
</header>

<main class="scanlines">
  <section class="dialogue" id="dialogue" aria-live="polite"></section>

  <footer class="input-row chrome" role="form">
    <span class="prompt-glyph" aria-hidden="true">≥</span>
    <input id="input" type="text" autocomplete="off" autofocus
      placeholder="ask anything — press Enter to send"
      aria-label="chat input" />
  </footer>
</main>

<aside class="trace" aria-label="tool trace" aria-live="off">
  <div class="trace-head">TOOL TRACE</div>
  <ol id="trace" class="trace-list"></ol>
</aside>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
