# smcity — Mac Studio production deploy (v0.4.17, zero-downtime).
#
# Four services on a shared bridge network:
#   smcity-agent-blue   : agent replica #1 (FastAPI)
#   smcity-agent-green  : agent replica #2 — same image, same env, same
#                         shared volume. Both are healthy at all times.
#   smcity-router       : tiny nginx that load-balances the two replicas
#                         and retries on the other when one is being
#                         recreated, so rolling rebuilds never drop a
#                         request.
#   smcity-tailscale    : the public-facing sidecar. Points to the router,
#                         not to either replica directly.
#
# Deploy workflow (see ./deploy.sh):
#   1. Build the new image.
#   2. Recreate `smcity-agent-blue` — traffic flows entirely to green
#      via nginx's failover.
#   3. Wait for blue's healthcheck to go green.
#   4. Recreate `smcity-agent-green` — traffic flows entirely to blue.
#   5. Done — both replicas are now on the new image, no downtime.
#
# Why two replicas of the same image: we want EVERY rolling restart to
# work, not just the first one. A single "live" replica with a "warm
# standby" would need a stateful router config; nginx round-robins by
# default and `proxy_next_upstream` gives us the failover for free.

services:

  smcity-agent-blue:
    build:
      context: ..
      dockerfile: Dockerfile
    image: smcity:0.4.17
    container_name: smcity-agent-blue
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_BASE_URL: http://host.docker.internal:1234/v1
      LLM_MODEL: openai/gpt-oss-120b
      LLM_TIMEOUT_S: "120"
      LOG_LEVEL: INFO
      WS_ALLOWED_ORIGINS: "*"
      RATE_PER_MIN: "60"
      RATE_BURST: "20"
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-smcity}
      # Replica label — appears as `service.instance.id` in Phoenix spans
      # so you can tell which replica served a given request.
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=blue"
    volumes:
      # The volume mounts at /app/state — NOT /app/data — so the read-only
      # JSON catalogs baked into the image at /app/data stay visible. The
      # session DB (sessions.sqlite3) lives at /app/state and persists
      # across container restarts.
      - smcity-sessions:/app/state
    networks:
      - smcity-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8080/health', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  smcity-agent-green:
    # Inherits the build context from blue (same image tag) — compose builds
    # once and both replicas use it.
    image: smcity:0.4.17
    container_name: smcity-agent-green
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_BASE_URL: http://host.docker.internal:1234/v1
      LLM_MODEL: openai/gpt-oss-120b
      LLM_TIMEOUT_S: "120"
      LOG_LEVEL: INFO
      WS_ALLOWED_ORIGINS: "*"
      RATE_PER_MIN: "60"
      RATE_BURST: "20"
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-smcity}
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=green"
    volumes:
      # The volume mounts at /app/state — NOT /app/data — so the read-only
      # JSON catalogs baked into the image at /app/data stay visible. The
      # session DB (sessions.sqlite3) lives at /app/state and persists
      # across container restarts.
      - smcity-sessions:/app/state
    networks:
      - smcity-net
    depends_on:
      smcity-agent-blue:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8080/health', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  smcity-router:
    image: nginx:alpine
    container_name: smcity-router
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - smcity-net
    depends_on:
      smcity-agent-blue:
        condition: service_healthy
      smcity-agent-green:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 explicitly — busybox wget resolves `localhost` to IPv6
      # first and nginx binds IPv4 only by default, so the spider check
      # fails "Connection refused" even when nginx is happy.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  smcity-tailscale:
    image: tailscale/tailscale:latest
    container_name: smcity-tailscale
    restart: unless-stopped
    cap_add:
      - net_admin
      - net_raw
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-smcity}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /tmp/tailscaled.sock
      TS_SERVE_CONFIG: /config/serveconfig.json
    volumes:
      - smcity-ts-state:/var/lib/tailscale
      - ./serveconfig.json:/config/serveconfig.json:ro
    hostname: smcity
    depends_on:
      smcity-router:
        condition: service_healthy
    networks:
      - smcity-net

volumes:
  smcity-sessions:
  smcity-ts-state:

networks:
  smcity-net:
    driver: bridge
