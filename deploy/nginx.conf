# Zero-downtime router for the smcity agent.
#
# Listens on :8080 inside the smcity-net bridge network. The Tailscale
# sidecar's serve-config proxies to this nginx, not directly to an agent
# replica. With two upstreams (blue + green) nginx automatically routes
# only to whichever is currently healthy, so a rolling rebuild of one
# replica never drops a request.
#
# The `max_fails=1 fail_timeout=5s` pair makes nginx mark an upstream as
# unhealthy on the first failed request (which happens during a container
# restart) and stop trying it for 5s — long enough for compose to bring
# the new instance up. `slow_start` would be cleaner but is an nginx-plus
# feature.

events {
    worker_connections 1024;
}

http {
    upstream smcity_agents {
        server smcity-agent-blue:8080  max_fails=1 fail_timeout=5s;
        server smcity-agent-green:8080 max_fails=1 fail_timeout=5s;
    }

    # Map Upgrade header for WebSocket proxying — /ws/{session_id} needs
    # the Upgrade + Connection headers preserved end-to-end.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Generous timeouts — LLM responses can take 30-60s for long
        # multi-tool turns and we don't want nginx to truncate them.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;

        # Don't buffer streaming responses — the WS path needs immediate
        # frame delivery, and the /turn JSON is small enough to not need it.
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://smcity_agents;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade for /ws/{session_id}.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Retry the OTHER upstream on connection failures — this is what
            # makes the deploy genuinely zero-downtime. `non_idempotent`
            # lets us retry POST /turn too (the agent handlers are
            # idempotent given a fresh session-state; worth the trade-off
            # for boss demos where 5xx is unacceptable).
            proxy_next_upstream error timeout http_502 http_503 http_504
                                non_idempotent;
            proxy_next_upstream_tries 2;
        }
    }
}
