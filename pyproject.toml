[project]
name = "smcity"
version = "0.5.2"
description = "HK Smart City agentic chat for the Lab of Social Robotics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lab of Social Robotics" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "openai>=1.55.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "msgspec>=0.18.0",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "rapidfuzz>=3.10.0",
    "opencc-python-reimplemented>=0.1.7",
    # Observability — Phoenix Arize via OpenTelemetry. Optional at runtime
    # (no-op exporter if PHOENIX_API_KEY is not set), but the SDK and the
    # OpenInference instrumentations are required to expose spans for
    # LLM calls, HTTP calls, and our tool dispatcher.
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "openinference-instrumentation-openai>=0.1.18",
    "openinference-semantic-conventions>=0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smcity", "smcity_fuzz"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4",
    "SIM", "RET", "PTH", "PLC", "PLE", "PLW", "RUF",
]
ignore = [
    "S101",   # use of assert — fine in tests
    "PLC0415", # deferred imports — we use them intentionally
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]
"scripts/**" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
pretty = true
exclude = ["web/", "build/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires live LM Studio endpoint — run with pytest -m integration",
]
